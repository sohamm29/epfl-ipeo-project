name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

  workflow_dispatch:

jobs:
  pre-commit-ci-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch # local check to ensure no commit direct to main

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::CI failed! Run './scripts/ci.sh' (Linux/macOS) or '.\scripts\ci.ps1' (Windows) locally to reproduce and fix."
          echo "### :x: CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Run \`./scripts/ci.sh\` (Linux/macOS) or \`.\scripts\ci.ps1\` (Windows) locally to reproduce and fix the issues." >> $GITHUB_STEP_SUMMARY
